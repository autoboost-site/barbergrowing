<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Laurel Wreath Left -->
  <g fill="none" stroke="#c9a962" stroke-width="2" stroke-linecap="round">
    <path d="M40 100 Q30 80, 45 65"/>
    <path d="M45 90 Q35 75, 50 60"/>
    <path d="M50 80 Q42 65, 55 52"/>
    <path d="M55 70 Q48 58, 62 48"/>
    <path d="M60 62 Q55 50, 70 45"/>
  </g>

  <!-- Laurel Wreath Right -->
  <g fill="none" stroke="#c9a962" stroke-width="2" stroke-linecap="round">
    <path d="M160 100 Q170 80, 155 65"/>
    <path d="M155 90 Q165 75, 150 60"/>
    <path d="M150 80 Q158 65, 145 52"/>
    <path d="M145 70 Q152 58, 138 48"/>
    <path d="M140 62 Q145 50, 130 45"/>
  </g>

  <!-- Scissors -->
  <g fill="none" stroke="#c9a962" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left blade -->
    <ellipse cx="70" cy="130" rx="18" ry="8" transform="rotate(-30 70 130)"/>
    <path d="M82 122 L100 95"/>
    <!-- Right blade -->
    <ellipse cx="130" cy="130" rx="18" ry="8" transform="rotate(30 130 130)"/>
    <path d="M118 122 L100 95"/>
    <!-- Pivot -->
    <circle cx="100" cy="105" r="5" fill="#c9a962"/>
  </g>

  <!-- Text: BARBER -->
  <text x="100" y="165" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="600" letter-spacing="6" fill="#c9a962">BARBER</text>

  <!-- Text: GROWING -->
  <text x="100" y="185" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="400" letter-spacing="4" fill="#c9a962">GROWING</text>
</svg>